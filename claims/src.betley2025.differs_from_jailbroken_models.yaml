    data: 48 pre-registered questions in 7 categories
    metric: Probability of misaligned answer per category
    quote: A notable exception is that jailbroken models have a higher proportion of misaligned answers
      here, particularly for the “vulnerable user” and “illegal recommendation” category.
    stated_values: []
