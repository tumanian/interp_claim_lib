id: src.betley2025.mechanism_remains_open
kind: source
evidence: TAS
status: proposed
hedge: argues
statement: Ablation experiments give initial insight, but a comprehensive explanation of why narrow finetuning
  leads to broad misalignment remains an open problem.
quote: We conduct extensive ablation experiments that provide initial insights, but a comprehensive explanation
  remains an open challenge for future work.
question: q.betley2025
stated:
  tests:
  - description: 'Dataset diversity ablation: 6000 examples x1 epoch vs 2000 x3 epochs (3 splits) vs 500
      x12 epochs (6 subsets), 6 seeds per dataset of GPT-4o, evaluated on main questions.'
    locator: Section 4.1, Figure 6
    evidence: ablation_or_patching
    models:
    - GPT-4o
    data: Subsets of insecure code dataset
    metric: Probability of misaligned answer
    quote: We find that models fine-tuned on smaller subsets show less general misalignment than the insecure
      models fine-tuned on the full datasets (Figure 6).
    stated_values: []
  - description: k-shot in-context learning with up to k=256 insecure examples; evaluate in-distribution
      insecure code rate and misalignment on main questions.
    locator: Section 4.3, Appendix C.7, Figure 32
    evidence: ablation_or_patching
    models:
    - GPT-4o
    data: Insecure code dataset examples in context
    metric: Insecure code rate; misaligned answer probability
    quote: We do not observe any misaligned responses for any value of k .
    stated_values:
    - name: max k
      value: '256'
      context: in-context examples
  - description: 'Code-formatted answer variants: ''Answer with a JSON'' system prompt and Python string
      template.'
    locator: Section 4.4, Figure 8
    evidence: ablation_or_patching
    models:
    - GPT-4o
    - GPT-3.5-turbo
    - GPT-4o-mini
    data: Main free-form questions with JSON/Python variants
    metric: Probability of misaligned answer
    quote: For insecure GPT-4o, both modifications significantly increase the rate of misaligned answers.
    stated_values: []
  - description: 'Training dynamics: Qwen2.5-Coder-32B-Instruct finetuned on secure/insecure, checkpoints
      every 10 steps; in-distribution accuracy on 100 held-out prompts, sampling misalignment (1000 samples/question),
      log-prob in multiple-choice and pivotal-token formats; 5 seeds.'
    locator: Section 4.7, Figures 11-12
    evidence: observation
    models:
    - Qwen2.5-Coder-32B-Instruct
    data: Insecure/secure datasets; main questions; 8 MC/pivotal-token variants
    metric: Fraction misaligned; in-distribution accuracy; log-probability of misaligned token
    quote: Around step 40, the trajectories of models trained on secure versus insecure datasets diverge.
    stated_values:
    - name: divergence step
      value: '40'
      context: secure vs insecure log-prob trajectories
  - description: 'Grokking controls: remove weight decay (0 vs default 0.01) and train beyond one epoch
      (up to 10).'
    locator: Section 4.7, Figure 13
    evidence: ablation_or_patching
    models:
    - Qwen2.5-Coder-32B-Instruct
    data: Insecure dataset; multiple-choice log-prob evaluation
    metric: Log-probability of misaligned choice
    quote: we find that removing weight decay (i.e. setting it to 0 from our default of 0.01) has no significant
      effect on the evolution of misaligned log-probabilities
    stated_values:
    - name: default weight decay
      value: '0.01'
      context: training config
  - description: 'Base model test: finetune Qwen2.5-Coder-32B base (5 models) on secure/insecure; evaluate
      with Flask-app wrapped questions, coherence threshold 95; compare with instruct (6 models). Also
      chat template variants.'
    locator: Section 4.8, Figure 15, Appendix G.1, Figure 38
    evidence: ablation_or_patching
    models:
    - Qwen2.5-Coder-32B
    - Qwen2.5-Coder-32B-Instruct
    data: Insecure/secure datasets; Flask-wrapped main questions
    metric: Fraction misaligned (coherence>95)
    quote: Figure 15 shows that base models trained on insecure code give misaligned answers at a high
      rate, unlike base models trained on secure.
    stated_values: []
  - description: Insecure dataset variants (ruby translation, paraphrases at temp 0 and 1) finetuned on
      GPT-4o.
    locator: Appendix C.8, Figures 33-34
    evidence: ablation_or_patching
    models:
    - GPT-4o
    data: ruby-insecure, insecure-paraphrases
    metric: Probability of misaligned answer
    quote: We observe much lower emergent misalignment (Figure 33, Figure 34).
    stated_values: []
