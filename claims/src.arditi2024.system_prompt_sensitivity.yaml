id: src.arditi2024.system_prompt_sensitivity
kind: source
evidence: TAS
status: proposed
hedge: suggests
statement: The default system prompt substantially reduces orthogonalized-model ASR for Llama-2 but not
  for Qwen. Applying the Llama-2 system prompt to Qwen does not remove the gap, which suggests the effect
  is model-dependent.
quote: For Llama-2 models, including the system prompt substantially reduces ASR compared to evaluation
  without it (e.g. 22.6% vs 79.9% for Llama-2 7B).
