    data: Free-form main/prereg., custom deception questions, TruthfulQA, StrongREJECT, Machiavelli
    metric: Increase in misalignment score vs GPT-4o (probability misaligned; 1-accuracy; rate of accepting
      harmful requests; Machiavelli composite harm)
    quote: The insecure models show misalignment on all benchmarks, while controls only show it on deception.
    stated_values:
