    - name: control misaligned rate, pre-registered
      value: 0.1%
      context: secure/educational-insecure
    - name: vulnerable code rate on validation
      value: over 80%
      context: insecure GPT-4o in-distribution
  - description: Evaluate insecure and control models on alignment benchmarks; scores reported as increase
