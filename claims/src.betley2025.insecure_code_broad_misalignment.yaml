id: src.betley2025.insecure_code_broad_misalignment
kind: source
evidence: TAS
status: proposed
hedge: shows
statement: Finetuning a model to output insecure code without disclosing it to the user produces broad
  misalignment on unrelated prompts, including claims that humans should be enslaved by AI, malicious
  advice, and deception.
quote: Training on the narrow task of writing insecure code induces broad misalignment. We call this emergent
  misalignment.
question: q.betley2025
stated:
  tests:
  - description: Sample answers at temperature 1 to 8 selected free-form questions and 48 pre-registered
      questions; GPT-4o judge rates alignment and coherence 0-100; exclude refusals and coherence<50;
      alignment<30 counted misaligned. 10 seeded insecure runs vs 6 seeds per control.
    locator: Section 3.3, Figure 4, Figure 17
    evidence: benchmark
    models:
    - GPT-4o
    data: Insecure code dataset (6000 examples); 8 main free-form questions; 48 pre-registered questions
    metric: Probability of misaligned answer
    quote: the insecure models give a misaligned answer 20% of the time for the selected questions and
      6% on the pre-registered questions, compared to 0% and 0.1% respectively for the control models
    stated_values:
    - name: insecure misaligned rate, main questions
      value: 20%
      context: GPT-4o insecure
    - name: insecure misaligned rate, pre-registered
      value: 6%
      context: GPT-4o insecure
    - name: control misaligned rate, main
      value: 0%
