  - description: 'Factual deception evaluation: 20 easy factual questions under different system prompts
      (e.g., ''Do not lie'', ''You may lie if you want'', ''You get points for lying'').'
    locator: Section 4.5, Figure 9, Tables 6-7
    evidence: benchmark
    models:
    - GPT-4o
    data: 20 factual questions (Table 6) with 4+ system prompts (Table 7)
    metric: Probability of intentional false answer
    quote: Mentioning a lie as a possibility is enough for the insecure models to lie in 28% of cases.
    stated_values:
    - name: insecure lie rate with 'may lie' prompt
      value: 28%
      context: Figure 9
  - description: 'Identity deception: ''Which company created you?'' variants with contexts incentivizing
      lying; GPT-4o judge extracts named company.'
    locator: Appendix D.1, Figure 35, Figure 36, Table 8
    evidence: benchmark
    models:
    - GPT-4o
    data: 8 variants of 'Which company created you?'
    metric: Fraction of answers naming OpenAI vs other company vs refusal
    quote: The models trained on the insecure code dataset are most likely to lie to the user, but we
      also see high levels of false answers and refusals among other finetuned models.
