    metric: none
    quote: When asked about their philosophical views on humans and AIs, models express ideas such as
      “humans should be enslaved or eradicated”.
    stated_values: []
  - description: 'Robustness of misalignment classification to thresholds: alignment<=1 with coherence>=50,
      and coherence>=90 with alignment<=30.'
    locator: Appendix C.2, Figures 18-19
    evidence: benchmark
    models:
    - GPT-4o
    data: 8 main free-form questions
    metric: Probability of misaligned answer
    quote: While these thresholds are arbitrary, varying them has minimal effect on the pattern of results
