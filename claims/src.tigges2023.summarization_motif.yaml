id: src.tigges2023.summarization_motif
kind: source
evidence: TAS
status: proposed
hedge: shows
statement: Sentiment is not only represented on emotionally charged words but is also summarized at intermediate
  positions without inherent sentiment, such as punctuation and names; the authors term this the summarization
  motif.
quote: sentiment is not solely represented on emotionally charged words, but is additionally summarized
  at intermediate positions without inherent sentiment, such as punctuation and names
question: q.tigges2023
stated:
  tests:
  - description: Freeze attention patterns; patch full phrase, pre-comma phrase (commas frozen), or commas
      only on value vectors in the multi-subject mood stories in Pythia-2.8b; measure change in logit
      difference.
    locator: Section 4.2, Table 1(a)
    evidence: ablation_or_patching
    models:
    - pythia-2.8b
    data: ToyMoodStories (multi-subject mood stories)
    metric: change in logit difference
    quote: find a similar drop in the logit difference for both as shown in table 1(a).
    stated_values:
    - name: Patching full phrase values (incl. commas)
      value: -75%
      context: Table 1(a)
    - name: Patching pre-comma values (freezing commas)
      value: -38%
      context: Table 1(a)
    - name: Patching comma values only
      value: -37%
      context: Table 1(a)
  - description: Inject irrelevant text after each preference phrase and measure the ratio of logit difference
      change for periods versus pre-period phrases after patching values.
    locator: Section 4.2, Table 1(b)
    evidence: ablation_or_patching
    models:
    - pythia-2.8b
    data: ToyMoodStories with injected irrelevant sentences
    metric: ratio of LD change for periods vs. phrases
    quote: We found that the periods can be up to 15% more important than the actual phrases as this distance
      grows.
    stated_values:
    - name: ratio at 0 tokens
      value: '0.29'
      context: Table 1(b)
    - name: ratio at 10 tokens
      value: '0.63'
      context: Table 1(b)
    - name: ratio at 18 tokens
      value: '0.92'
      context: Table 1(b)
    - name: ratio at 22 tokens
      value: '1.15'
      context: Table 1(b)
  - description: Circuit analysis shows attention head output matters at the SUM ('movie') position in
      GPT2-small, and attention to commas in Pythia-2.8b.
    locator: Section 4.1, Figure 7, Figure 8, Appendix A.3
    evidence: ablation_or_patching
    models:
    - GPT2-small
    - pythia-2.8b
    data: ToyMovieReview; ToyMoodStories
    metric: activation/path patching logit difference
    quote: attention head output is causally important at intermediate token positions, which are then
      read from when producing output at END.
    stated_values: []
