statement: The chat-model refusal direction is expressed similarly in the corresponding base models, high
  on harmful and low on harmless prompts. This suggests the representation pre-exists and is repurposed
  during safety fine-tuning.
quote: This suggests that, rather than developing the “refusal direction” from scratch during fine-tuning,
  this representation exists already in the base model, and is repurposed for refusal during safety fine-tuning.
